# Launch command — --ext must come BEFORE the subcommand:
#
#   SE_RECORD_TRACE=true java -jar selenium-server.jar \
#     --ext build/libs/selenium-playwright-trace-1.0.0-SNAPSHOT.jar \
#     node \
#     --config node.toml
#
# Activation:
#   SE_RECORD_TRACE=true   env var  — global default (trace all Chromium sessions)
#   se:recordTrace=true/false cap   — per-session override (takes priority over global)

[node]
port = 5555
max-sessions = 4
session-timeout = 300

[playwright-trace]
# output-dir = "/tmp/playwright-traces"   # default: {user.dir}/traces
screenshots = true
snapshots = true
