name: Publish to Maven Central

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      seleniumVersion:
        description: 'Selenium version to build against (e.g. 4.42.0, or 4.43.0-SNAPSHOT for nightly). Defaults to + (latest on Maven Central).'
        type: string
        default: '+'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Strip leading 'v' from tag to set version
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Set release version
        if: startsWith(github.ref, 'refs/tags/v')
        run: sed -i "s/^version = .*/version = \"$RELEASE_VERSION\"/" build.gradle.kts

      - name: Publish release to Maven Central
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: >
          ./gradlew publishToSonatype closeAndReleaseSonatypeStagingRepository
          -PseleniumVersion=${{ inputs.seleniumVersion || '+' }}
          --no-daemon

      - name: Publish snapshot to Maven Central
        if: "!startsWith(github.ref, 'refs/tags/v')"
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: >
          ./gradlew publishToSonatype
          -PseleniumVersion=${{ inputs.seleniumVersion || '+' }}
          --no-daemon
