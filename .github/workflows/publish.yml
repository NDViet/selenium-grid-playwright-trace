name: Publish to Maven Central

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      seleniumVersion:
        description: 'Selenium version to build against and deploy (e.g. 4.42.0). Defaults to + (latest on Maven Central).'
        type: string
        default: '+'
      release:
        description: 'Publish as release (version = seleniumVersion). Unchecked publishes as seleniumVersion-SNAPSHOT.'
        type: boolean
        default: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # --- Tag push: derive version from the tag (e.g. v4.42.0 → 4.42.0) ---
      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "DEPLOY_VERSION=$VERSION" >> $GITHUB_ENV
          echo "IS_RELEASE=true" >> $GITHUB_ENV
          sed -i "s/^version = .*/version = \"$VERSION\"/" build.gradle.kts

      # --- Manual dispatch: derive version from seleniumVersion input ---
      - name: Set version from input
        if: github.event_name == 'workflow_dispatch'
        run: |
          SEL_VER="${{ inputs.seleniumVersion }}"
          if [[ "${{ inputs.release }}" == "true" ]]; then
            DEPLOY_VERSION="$SEL_VER"
            echo "IS_RELEASE=true" >> $GITHUB_ENV
          else
            DEPLOY_VERSION="${SEL_VER}-SNAPSHOT"
            echo "IS_RELEASE=false" >> $GITHUB_ENV
          fi
          echo "DEPLOY_VERSION=$DEPLOY_VERSION" >> $GITHUB_ENV
          sed -i "s/^version = .*/version = \"$DEPLOY_VERSION\"/" build.gradle.kts

      - name: Publish release to Maven Central
        if: env.IS_RELEASE == 'true'
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: >
          ./gradlew publishToSonatype closeAndReleaseSonatypeStagingRepository
          -PseleniumVersion=${{ inputs.seleniumVersion || '+' }}
          --no-daemon

      - name: Publish snapshot to Maven Central
        if: env.IS_RELEASE == 'false'
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: >
          ./gradlew publishToSonatype
          -PseleniumVersion=${{ inputs.seleniumVersion || '+' }}
          --no-daemon
